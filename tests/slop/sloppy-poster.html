<!doctype html><meta charset="utf-8"><title>Jazz Night</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Inter&display=swap" rel="stylesheet">
<style>
body{margin:0;height:100vh;display:grid;place-items:center;font-family:Inter,sans-serif;background:linear-gradient(135deg,#6d28d9,#2563eb 50%,#db2777);color:#fff;overflow:hidden}
.blob{position:absolute;width:420px;height:420px;border-radius:50%;background:#a855f7;filter:blur(90px);top:-80px;left:-60px}
.dot{position:absolute;width:18px;height:18px;border-radius:50%;background:#fde047}
.wrap{text-align:center;position:relative}
.eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
h1{font-family:Poppins;font-size:72px;margin:.2em 0;text-shadow:0 0 30px rgba(236,72,153,.8)}
h1 span{background:linear-gradient(90deg,#fde047,#f472b6);-webkit-background-clip:text;color:transparent}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);margin:4px;font-size:14px}
.card{background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:20px;padding:22px;margin:24px auto;width:420px;box-shadow:0 0 40px rgba(168,85,247,.6)}
button{padding:14px 28px;border-radius:999px;border:0;background:#f472b6;color:#fff;font-size:16px;box-shadow:0 0 30px rgba(244,114,182,.8)}
</style>
<div class="blob"></div>
<div class="dot" style="top:12%;left:20%"></div><div class="dot" style="top:70%;left:80%"></div><div class="dot" style="top:30%;left:88%"></div>
<div class="dot" style="top:85%;left:10%"></div><div class="dot" style="top:50%;left:6%"></div><div class="dot" style="top:18%;left:70%"></div>
<div class="wrap">
  <p class="eyebrow">Live music ✨</p>
  <h1>Jazz Night. <span>Unforgettable</span> Vibes.</h1>
  <div><span class="pill">🎷 Friday</span><span class="pill">📍 Downtown</span><span class="pill">🎟 Free</span><span class="pill">🍸 Drinks</span><span class="pill">🎶 DJ</span><span class="pill">⭐ VIP</span></div>
  <div class="card">Unleash your inner music lover and elevate your weekend with an immersive experience you'll never forget.</div>
  <button>Get tickets →</button>
</div>
