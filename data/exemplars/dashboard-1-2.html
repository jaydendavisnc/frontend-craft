<!doctype html>
<!-- The four KPI cells are the chart's own tabs, so one ruled panel holds value, delta and trend. The line morphs in 300ms between metrics rather than redrawing, the axis comes from a computed nice() scale, and it carries a dashed pace line with an end tick, a comparison line, a crosshair tooltip that lists every series, and a table view of the same numbers. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed POs report</title>
<link href="https://fonts.googleapis.com/css2?family=Zalando+Sans:wght@400..500&display=swap" rel="stylesheet">
<style>
:root{

  --ease:cubic-bezier(.215,.61,.355,1); --pad:40px;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/20px var(--font-text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,select{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h2,h3{font-weight:500}table{width:100%;border-collapse:collapse}.i{width:15px;height:15px;flex:none;fill:currentColor}
:focus{outline:0}:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
main{padding:32px var(--pad) 56px;max-width:1360px;margin:0 auto}
/* Report head */
.report-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;padding-top:4px}
.report-head h2{font-size:17px;line-height:24px}.controls{display:flex;align-items:center;gap:8px}
.date-trigger{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--rule);white-space:nowrap;transition:box-shadow .15s var(--ease),background-color .15s var(--ease)}
.date-trigger:hover{box-shadow:inset 0 0 0 1px var(--line-strong);background:var(--fill-hover)}.date-trigger .i{color:var(--ink-2)}
.select{position:relative;display:inline-flex;align-items:center;height:36px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--rule);transition:box-shadow .15s var(--ease),background-color .15s var(--ease)}.select:hover{box-shadow:inset 0 0 0 1px var(--line-strong);background:var(--fill-hover)}
.select span{padding-left:10px;color:var(--ink-2);white-space:nowrap}.select select{appearance:none;-webkit-appearance:none;border:0;background:none;height:36px;padding:0 28px 0 6px;font-weight:500;border-radius:6px;cursor:pointer;max-width:180px}
.select .i{position:absolute;right:8px;top:10px;pointer-events:none;color:var(--ink-2)}

.panel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden}

.chart-tools{display:flex;align-items:center;gap:16px}.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;line-height:16px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}.legend i.dash{width:12px;height:0;border-radius:0;border-top:1px dashed var(--ink);vertical-align:middle;margin-top:-2px}

.plot-wrap{position:relative;min-height:280px}.plot{display:block;overflow:visible;touch-action:pan-y}
.plot .grid{stroke:var(--line)}.plot .base{stroke:var(--line-strong)}.plot .tick{font:400 12px/1 var(--font-text);fill:var(--ink-2);font-variant-numeric:tabular-nums}.plot .cross{stroke:var(--line-strong)}.plot.swap .tick,.plot.swap .grid{animation:fade .24s var(--ease)}
@keyframes fade{from{opacity:0}}
.tip{position:absolute;z-index:3;min-width:176px;padding:8px 10px;background:var(--bg);border-radius:8px;box-shadow:0 0 0 1px var(--line),0 8px 24px -8px rgba(0,0,0,.18);font-size:12px;line-height:18px;pointer-events:none}.tip b{display:block;font-weight:500;margin-bottom:2px}
.tip div{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;color:var(--ink-2)}.tip i{width:8px;height:8px;border-radius:2px}.tip em{font-style:normal;color:var(--ink)}
.chart-table{height:280px;overflow:auto}.tbl th{height:36px;padding:0 10px;font-size:12px;font-weight:500;color:var(--ink-2);text-align:left;white-space:nowrap;border-bottom:1px solid var(--rule);background:var(--bg);position:sticky;top:0}
.tbl td{height:36px;padding:0 10px;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.tbl .r{text-align:right}.tbl tbody tr:hover td{background:var(--fill-hover)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important}}
</style>

    if (o.paceEnd != null) { const x = X(n - 1), y = Y(o.paceEnd); svgEl('line', { x1: x, x2: x, y1: y - 8, y2: y + 8, stroke: 'var(--ink)', 'stroke-width': 1 }, svg); }
    const cross = svgEl('line', { y1: T0, y2: H - B, class: 'cross', visibility: 'hidden' }, svg);
    const dots = o.series.map(s => svgEl('circle', { r: 4, fill: s.color, stroke: 'var(--bg)', 'stroke-width': 2, visibility: 'hidden' }, svg));
    const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dots.forEach(c => c.setAttribute('visibility', 'hidden')); };
    svg.onpointermove = e => {
      const r = svg.getBoundingClientRect(), i = Math.round((e.clientX - r.left - L) / (W - L - R) * (n - 1));
      if (i < 0 || i >= n) return hide();
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('visibility', 'visible');
      dots.forEach((c, k) => { const y = ys[k][i]; c.setAttribute('visibility', y == null ? 'hidden' : 'visible'); if (y != null) { c.setAttribute('cx', X(i)); c.setAttribute('cy', y); } });
      tip.hidden = false;
      tip.innerHTML = `<b>${o.tips[i]}</b>` + o.series.slice().reverse().map(s => `<div><i style="background:${s.color}"></i><span>${s.name}</span><em>${s.values[i] == null ? DASH : o.tipFmt(s.values[i])}</em></div>`).join('');
      const tw = tip.offsetWidth; tip.style.left = Math.min(W - tw - 4, Math.max(4, X(i) + (X(i) + tw + 24 > W ? -tw - 12 : 12))) + 'px'; tip.style.top = T0 + 6 + 'px';
    };
    svg.onpointerleave = hide;
    charts.set(host, { o, ys: Object.fromEntries(o.series.map((s, k) => [s.name, ys[k]])), w: W });
  }
  const resizer = new ResizeObserver(entries => { for (const e of entries) { const c = charts.get(e.target); if (c && Math.abs(c.w - e.target.clientWidth) > 1) drawChart(e.target, c.o); } });
  function render() {
    const cfg = chartConfig();
    $('#report').innerHTML = `<div class="span-4 kpis" role="tablist" aria-label="Chart metric">${kpiHTML()}</div>
      <div class="cell span-4"><div class="chart-head">
          <h3><span id="chartTitle">${METRICS[S.metric].title}</span><small id="chartSub">${chartSub() || '&nbsp;'}</small></h3>
          <div class="chart-tools"><div class="legend" id="legend">${legendHTML(cfg)}</div>
          <button class="icon" data-act="chartTable" aria-pressed="${S.chartTable}" aria-label="${S.chartTable ? 'Show chart' : 'Show as table'}" title="${S.chartTable ? 'Show chart' : 'Show as table'}">${ic(S.chartTable ? 'chart' : 'table')}</button></div>
        </div><div class="plot-wrap" id="plot">${S.chartTable ? chartTableHTML(cfg) : ''}</div></div>`;
    const host = $('#plot');
    if (!S.chartTable) { drawChart(host, cfg); resizer.observe(host); }
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    if (t.dataset.act === 'chartTable') { S.chartTable = !S.chartTable; return render(); }
    const host = $('#plot'), prev = charts.get(host); S.metric = t.dataset.metric;
    $$('.kpis .kpi').forEach(k => k.setAttribute('aria-selected', k === t));
    const cfg = chartConfig(); $('#legend').innerHTML = legendHTML(cfg);
    $('#chartTitle').textContent = METRICS[S.metric].title; $('#chartSub').innerHTML = chartSub() || '&nbsp;';
    if (S.chartTable) host.innerHTML = chartTableHTML(cfg);
    else if (host.querySelector('svg')) drawChart(host, cfg, prev && prev.ys);
  });
  $('#compare').onchange = e => { S.compare = e.target.value; render(); };
  render();
})();
</script>
</body>
</html>
